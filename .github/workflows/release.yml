name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version without the v prefix (for example 0.1.0)
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release version
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version $RELEASE_VERSION is not a stable release version" >&2
            exit 1
          fi

          expected_version="$(scripts/current-version.sh)"
          if [[ "$RELEASE_VERSION" != "$expected_version" ]]; then
            echo "Requested version $RELEASE_VERSION does not match main version $expected_version" >&2
            exit 1
          fi

      - name: Check release state
        run: |
          git fetch --force --tags origin
          if git rev-parse --quiet --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "$RELEASE_TAG already exists; investigate before retrying" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: oracle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and run tests
        run: ./gradlew clean build -PdatabaseTests=true

      - name: Require successful CI and example smoke tests
        run: |
          release_commit="$(git rev-parse HEAD)"
          for workflow in gradle-test.yml example-smoke-tests.yml; do
            result="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$release_commit&per_page=1" \
              --jq '.workflow_runs[0] | if .status == "completed" then .conclusion else .status end')"
            if [[ "$result" != "success" ]]; then
              echo "$workflow has not passed for $release_commit (status: $result)" >&2
              exit 1
            fi
          done

      - name: Create release tag
        run: |
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse refs/remotes/origin/main)" ]]; then
            echo "main changed while the release build was running; rerun Publish Release" >&2
            exit 1
          fi

          git config user.name "Namastack Release Automation"
          git config user.email "info@rolandbeisel.de"
          git tag --annotate "$RELEASE_TAG" --message "Namastack Once $RELEASE_VERSION"
          git push origin "$RELEASE_TAG"

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
        run: ./gradlew publishToMavenCentral -Prelease=true --no-configuration-cache --no-daemon

      - name: Create GitHub Release
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Namastack Once $RELEASE_TAG" \
            --generate-notes \
            --verify-tag \
            --fail-on-no-commits
