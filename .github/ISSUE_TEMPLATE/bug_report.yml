name: Bug report
description: Report unexpected Once behavior.
body:
  - type: textarea
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Include the scope, transaction boundaries and minimal code without sensitive keys.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Once, Spring Boot, Java, database and JDBC driver versions.
    validations:
      required: true
